<app-auth-layout>
  <div class="d-flex flex-column h-100">
    <div class="auth-brand p-4">
      <a routerLink="/" class="logo-light">
        <img src="assets/images/logo.png" alt="logo" height="22" />
      </a>
      <a routerLink="/" class="logo-dark">
        <img src="assets/images/logo-dark.png" alt="dark logo" height="22" />
      </a>
    </div>
    <div class="p-4 my-auto">
      <div class="text-center w-75 m-auto">
        <img
          src="assets/images/users/avatar-1.jpg"
          height="64"
          alt="user-image"
          class="rounded-circle img-fluid img-thumbnail avatar-xl"
        />
        <h4 class="text-center mt-3 fw-bold fs-20">Hi ! Thomson</h4>
        <p class="text-muted mb-4">Enter your password to access the admin.</p>
      </div>

      <form action="#">
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            class="form-control"
            type="email"
            id="password"
            required=""
            placeholder="Enter your password"
          />
        </div>

        <div class="mb-0 text-start">
          <button class="btn btn-soft-primary w-100" type="submit">
            <i class="ri-login-circle-fill me-1"></i>
            <span class="fw-bold">Log In</span>
          </button>
        </div>

        <div class="text-center mt-4">
          <p class="text-muted fs-16">Sign in with</p>
          <div class="d-flex gap-2 justify-content-center mt-3">
            <a href="javascript: void(0);" class="btn btn-soft-primary"
              ><i class="ri-facebook-circle-fill"></i
            ></a>
            <a href="javascript: void(0);" class="btn btn-soft-danger"
              ><i class="ri-google-fill"></i
            ></a>
            <a href="javascript: void(0);" class="btn btn-soft-info"
              ><i class="ri-twitter-fill"></i
            ></a>
            <a href="javascript: void(0);" class="btn btn-soft-dark"
              ><i class="ri-github-fill"></i
            ></a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <ng-template #bottomLinks>
    <div class="row">
      <div class="col-12 text-center">
        <p class="text-dark-emphasis">
          Back To
          <a
            routerLink="/auth/login"
            class="text-dark fw-bold ms-1 link-offset-3 text-decoration-underline"
            ><b>Log In</b></a
          >
        </p>
      </div>
    </div>
  </ng-template>
</app-auth-layout>
