<app-auth-layout>
  <div class="d-flex flex-column h-100">
    <div class="auth-brand p-4">
      <a routerLink="/" class="logo-light">
        <img src="assets/images/logo.png" alt="logo" height="22" />
      </a>
      <a routerLink="/" class="logo-dark">
        <img src="assets/images/logo-dark.png" alt="dark logo" height="22" />
      </a>
    </div>
    <div class="p-4 my-auto">
      <h4 class="fs-20">Forgot Password?</h4>
      <p class="text-muted mb-3">
        Enter your email address and we'll send you an email with instructions
        to reset your password.
      </p>

      <form action="#">
        <div class="mb-3">
          <label for="emailaddress" class="form-label">Email address</label>
          <input
            class="form-control"
            type="email"
            id="emailaddress"
            required=""
            placeholder="Enter your email"
          />
        </div>

        <div class="mb-0 text-start">
          <button class="btn btn-soft-primary w-100" type="submit">
            <i class="ri-loop-left-line me-1 fw-bold"></i>
            <span class="fw-bold">Reset Password</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <ng-template #bottomLinks>
    <div class="row">
      <div class="col-12 text-center">
        <p class="text-dark-emphasis">
          Back To
          <a
            routerLink="/auth/login"
            class="text-dark fw-bold ms-1 link-offset-3 text-decoration-underline"
            ><b>Log In</b></a
          >
        </p>
      </div>
    </div>
  </ng-template>
</app-auth-layout>
