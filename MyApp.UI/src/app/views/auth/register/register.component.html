<app-auth-layout>
  <div class="d-flex flex-column h-100">
    <div class="auth-brand p-4">
      <a routerLink="/" class="logo-light">
        <img src="assets/images/logo.png" alt="logo" height="22" />
      </a>
      <a routerLink="/" class="logo-dark">
        <img src="assets/images/logo-dark.png" alt="dark logo" height="22" />
      </a>
    </div>

    <div class="p-4 my-auto">
      <h4 class="fs-20">Create Account</h4>
      <p class="text-muted mb-3">
        Enter your details to create your account.
      </p>

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <div class="mb-3">
          <label for="fullname" class="form-label">Full Name</label>
          <input
            class="form-control"
            type="text"
            id="fullname"
            formControlName="fullName"
            placeholder="Enter your name"
            [ngClass]="{ 'is-invalid': submitted && form['fullName'].errors }"
          />
        </div>

        <div class="mb-3">
          <label for="emailaddress" class="form-label">Email address</label>
          <input
            class="form-control"
            type="email"
            id="emailaddress"
            formControlName="email"
            placeholder="Enter your email"
            [ngClass]="{ 'is-invalid': submitted && form['email'].errors }"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            class="form-control"
            type="password"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
          />
        </div>

        <div class="mb-3">
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="checkbox-signup"
              formControlName="acceptTerms"
              [ngClass]="{ 'is-invalid': submitted && form['acceptTerms'].errors }"
            />
            <label class="form-check-label" for="checkbox-signup">
              I accept
              <a href="javascript: void(0);" class="text-muted">
                Terms and Conditions
              </a>
            </label>
          </div>
        </div>

        <div class="text-success mb-2" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="text-danger mb-2" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="mb-0 d-grid text-center">
          <button class="btn btn-primary fw-semibold" type="submit" [disabled]="loading">
            {{ loading ? 'Creating Account...' : 'Sign Up' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <ng-template #bottomLinks>
    <div class="row">
      <div class="col-12 text-center">
        <p class="text-dark-emphasis">
          Already have account?
          <a
            routerLink="/auth/login"
            class="text-dark fw-bold ms-1 link-offset-3 text-decoration-underline"
          >
            <b>Log In</b>
          </a>
        </p>
      </div>
    </div>
  </ng-template>
</app-auth-layout>
