<app-page-title title="Reports-Contracts" subtitle="Reports" header="Client delivery summary" />

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Contracts Report</h5>
      <button class="btn btn-primary btn-sm" type="button" (click)="loadReport()">Refresh</button>
    </div>

    <div class="text-center py-4" *ngIf="loading">Loading...</div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Client ID</th>
            <th>Client Name</th>
            <th>Delivered Leads</th>
            <th>Last Delivery</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of rows">
            <td>{{ row.clientId }}</td>
            <td>{{ row.clientName }}</td>
            <td>{{ row.deliveredLeads || 0 }}</td>
            <td>{{ row.lastDelivery | date: 'short' }}</td>
          </tr>

          <tr *ngIf="rows.length === 0">
            <td colspan="4" class="text-center text-muted py-4">No data found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
