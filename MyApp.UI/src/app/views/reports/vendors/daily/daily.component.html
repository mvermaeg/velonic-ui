<app-page-title title="Reports-Vendors-Daily" subtitle="Reports-Vendors" header="Daily lead performance" />

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Vendor Daily Report</h5>
      <button class="btn btn-primary btn-sm" type="button" (click)="loadReport()">Refresh</button>
    </div>

    <div class="text-center py-4" *ngIf="loading">Loading...</div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Date</th>
            <th>Leads</th>
            <th>Sold</th>
            <th>Revenue</th>
            <th>Profit</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of rows">
            <td>{{ row.reportDate | date: 'mediumDate' }}</td>
            <td>{{ row.leads || 0 }}</td>
            <td>{{ row.sold || 0 }}</td>
            <td>{{ row.sales || row.revenue || 0 | number: '1.2-2' }}</td>
            <td>{{ row.profit || 0 | number: '1.2-2' }}</td>
          </tr>

          <tr *ngIf="rows.length === 0">
            <td colspan="5" class="text-center text-muted py-4">No data found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
