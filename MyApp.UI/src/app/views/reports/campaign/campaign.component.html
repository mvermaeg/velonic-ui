<app-page-title title="Reports-Campaign" subtitle="Reports" header="Campaign performance" />

<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Campaign Report</h5>
      <button class="btn btn-primary btn-sm" type="button" (click)="loadReport()">Refresh</button>
    </div>

    <div class="text-center py-4" *ngIf="loading">Loading...</div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Campaign</th>
            <th>Leads</th>
            <th>Sold</th>
            <th>Conversion %</th>
            <th>Sales</th>
            <th>Profit</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of rows">
            <td>{{ row.campaign || 'No Campaign' }}</td>
            <td>{{ row.leads || 0 }}</td>
            <td>{{ row.sold || 0 }}</td>
            <td>{{ getConversion(row) | number: '1.0-2' }}%</td>
            <td>{{ row.sales || 0 | number: '1.2-2' }}</td>
            <td>{{ row.profit || 0 | number: '1.2-2' }}</td>
          </tr>

          <tr *ngIf="rows.length === 0">
            <td colspan="6" class="text-center text-muted py-4">No data found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
